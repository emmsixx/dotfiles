name: Release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stow zsh
      - if: runner.os == 'macOS'
        run: brew install stow
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/dotfiles
      - run: sh -n setup.sh setup-server.sh
      - run: zsh -n .zshrc
      - run: bash -n .scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .pi/agent/extensions/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .pi/agent/extensions
      - run: npm run check && npm run format:check && npm test
        working-directory: .pi/agent/extensions

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
