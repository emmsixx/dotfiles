# Stable Codex defaults only.
# Project trust entries are local machine state and should not be committed.
model = "gpt-5.4"
model_reasoning_effort = "high"
service_tier = "fast"

[notice.model_migrations]
gpt-5-codex = "gpt-5.3-codex"
"gpt-5.2" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"
